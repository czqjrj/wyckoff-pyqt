[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wyckoff"
version = "1.0.0"
description = "威科夫 (Wyckoff) 桌面分析工具"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pyqtgraph>=0.13",
    "PyQt6>=6.6",
    "requests>=2.31",
    "pypinyin>=0.50",
    "openai>=1.30",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["wyckoff", "desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
