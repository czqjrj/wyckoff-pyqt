[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wyckoff"
version = "1.0.0"
description = "威科夫 (Wyckoff) 桌面分析工具"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pyqtgraph>=0.13",
    "PyQt6>=6.6",
    "requests>=2.31",
    # 行情数据容灾兜底源 (三个 HTTP 源全挂时用 akshare 兜底; 惰性导入)
    "akshare>=1.14",
    "pypinyin>=0.50",
    "openai>=1.30",
    "msgpack>=1.0",
    # MySQL 云存储后端 (登录 + 私有数据多机同步 + 校准数据同步)
    "PyMySQL>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]
lint = ["ruff>=0.6"]
# 可选: 解读语音播报 (TTS). edge-tts=微软在线中文语音(音质最佳, 需网络);
# pyttsx3=离线跨平台(中文音质一般, 依赖系统语音库 espeak/SAPI/NSSpeech).
tts = ["edge-tts>=6.1", "pyttsx3>=2.90"]
qlib = ["qlib>=1.6.0"]

[tool.setuptools]
packages = [
    "wyckoff",
    "ui",
    "ui.components",
    "ui.renderers",
    "ui.threads",
    "sync",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs", "build", "dist"]

[tool.ruff.lint]
# E/F=pyflakes+pycodestyle, W=warnings, I=import排序, UP=pyupgrade
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # 行长由 line-length 控制, 不强制报错
    "E722",   # 项目已统一用 except Exception (非 bare except), 允许
    "E402",   # 模块延迟导入 (QThread.run 内 import) 较多, 允许
    "UP035",  # typing.List/Dict 等兼容旧写法, 不强制升级
]

[tool.pytest.ini_options]
testpaths = ["tests"]
