name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: syntax + pytest (offscreen)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,lint]"
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 >/dev/null

      - name: Lint (ruff)
        run: ruff check wyckoff desktop tests

      - name: Syntax gate (compileall)
        run: python -m compileall -q wyckoff desktop tests

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Engine report (accuracy overview)
        run: |
          python -m wyckoff.signal_accuracy --eval 2>/dev/null || true